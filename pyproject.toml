[project]
name = "quick-tape"
version = "0.1.3"
description = "A cassette utility"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deezer-python>=7.4.0",
    "platformdirs>=4.13.5",
    "pyside6>=6.12.0",
    "requests>=2.34.2",
    "tomli-w>=1.2.0",
    "watchfiles>=1.3.0",
    "yt-dlp>=2026.8.19",
]
authors = [
    {name="tecknet"}
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pynput>=1.8.2",
]

[project.scripts]
main = "quick_tape.__main__:main"
dev = "quick_tape.dev:main"


