[project]
name = "quick-tape"
version = "0.1.3"
description = "A cassette utility"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deezer-python>=7.4.0",
    "platformdirs>=4.13.5",
    "pyside6>=6.12.0",
    "tomli-w>=1.2.0",
]
authors = [
    {name="tecknet"}
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project.scripts]
main = "quick_tape.__main__:main"


